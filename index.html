<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>失われた時間を探せ！ | 靱公園</title>
    <meta
      name="description"
      content="小Hと四季を巡り、靱公園の時間を取り戻そう。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23172e42'/%3E%3Cpath d='M16 6v11l7 4' fill='none' stroke='%2374e4cd' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="vendor/aframe.min.js"></script>
  </head>
  <body>
    <video
      id="camera-feed"
      autoplay
      muted
      playsinline
      aria-hidden="true"
    ></video>
    <div id="scene-host"></div>
    <header id="hud">
      <a href="./" aria-label="最初の画面へ">UTSUBO <span>TIME TRAVEL</span></a>
      <div id="count">時間のかけら 0 / 4</div>
    </header>
    <main id="welcome" class="sheet">
      <div class="eyebrow">靱公園 · 四季の旅</div>
      <h1>失われた<br /><em>時間</em>を探せ！</h1>
      <p>時間旅行者・小Hと一緒に、<br />止まった公園の時間を取り戻そう。</p>
      <div class="mode-title">体験する方法を選んでください</div>
      <button id="phone">
        スマートフォンでARを始める<small>5枚のカードを使う・座って体験</small>
      </button>
      <button id="quest" class="secondary">
        Quest 3でARを始める<small>透視AR・コントローラーで選択</small>
      </button>
      <button id="preview" class="text-button">カメラなしでプレビュー</button>
      <div class="upcoming">
        公園を歩くモードは、次の開発段階で追加予定です。
      </div>
      <a href="print.html" class="print-link" target="_blank" rel="noopener"
        >5枚のカードを印刷</a
      >
    </main>
    <div id="tracker-status" role="status" hidden></div>
    <section id="dialogue" class="dialogue" hidden aria-label="小Hの案内">
      <div class="dialogue-heading">
        <span>小H</span><span id="spot-label">はじまり</span>
      </div>
      <h2 id="dialogue-title"></h2>
      <p id="message" aria-live="polite"></p>
      <button id="action"></button>
    </section>
    <aside id="error" class="error" hidden role="alert">
      <p id="error-text"></p>
      <button id="retry">もう一度試す</button
      ><button id="error-preview" class="secondary">
        プレビューで確認する
      </button>
    </aside>
    <details id="debug" hidden>
      <summary>開発用コントロール</summary>
      <label
        >地点
        <select id="debug-spot">
          <option value="sundial">日時計</option>
          <option value="spring">春</option>
          <option value="summer">夏</option>
          <option value="autumn">秋</option>
          <option value="winter">冬</option>
        </select></label
      ><button id="debug-trigger">認識をシミュレート</button
      ><button id="debug-form">小Hの形態を切り替え</button
      ><button id="debug-collect">現在のイベントを完了</button
      ><button id="debug-final">エンディングへ</button
      ><button id="debug-reset">進行をリセット</button
      ><output id="debug-info"></output>
    </details>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
